name: Core tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run platform-neutral protocol and state tests
        run: scripts/test-domain.sh
